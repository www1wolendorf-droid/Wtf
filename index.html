@keyframes up{from{opacity:0;transform:translateY(16px) scale(.98)}to{opacity:1;transform:none}}@keyframes fl{50%{transform:translateY(-5px)}}@keyframes glow{50%{filter:drop-shadow(0 0 24px #fffb)}}@keyframes sh{to{left:140%}}@keyframes sl{from{transform:translateY(60px);opacity:0}}@keyframes fi{from{opacity:0}}@keyframes pl{40%{transform:scale(1.04);box-shadow:0 0 24px #fff5}}@keyframes pop{from{transform:scale(.5)}60%{transform:scale(1.12)}}@keyframes shk{10%,50%,90%{transform:translate(-5px,3px)}30%,70%{transform:translate(5px,-3px)}}@keyframes gr{from{transform:scaleY(0)}}@keyframes hop{40%{transform:translateY(-70px) scale(1.15)}}
#app>*{animation:up .5s cubic-bezier(.2,.8,.2,1) both}#app>*:nth-child(2){animation-delay:.05s}#app>*:nth-child(3){animation-delay:.1s}#app>*:nth-child(4){animation-delay:.15s}#app>*:nth-child(5){animation-delay:.2s}#app>*:nth-child(6){animation-delay:.25s}
.grid>.g{animation:up .5s both}.grid>.g:nth-child(2){animation-delay:.07s}.grid>.g:nth-child(3){animation-delay:.14s}.grid>.g:nth-child(4){animation-delay:.21s}.grid>.g:nth-child(5){animation-delay:.28s}.g{transition:transform .2s,border-color .2s}.g:hover{border-color:#777}.g:active{transform:scale(.95)}.g svg{animation:fl 3.2s ease-in-out infinite}.g:nth-child(2n) svg{animation-delay:-1s}.g:nth-child(3n) svg{animation-delay:-2s}
.logo svg{animation:glow 3s ease-in-out infinite}.btn{position:relative;overflow:hidden;transition:transform .15s,opacity .2s}.btn:active{transform:scale(.97)}.btn:not(.o):not(:disabled)::after{content:"";position:absolute;top:0;left:-60%;width:40%;height:100%;background:linear-gradient(90deg,transparent,#fff9,transparent);transform:skewX(-20deg);animation:sh 3.5s infinite}.chip{transition:.2s}.chip:active{transform:scale(.94)}
.cell{transition:transform .15s}.cell:active{transform:scale(.9)}.cell.new{animation:pop .4s cubic-bezier(.3,1.6,.5,1)}.cell.bomb{animation:shk .5s}.cell svg{width:68%;height:68%}
.pill.pulse{animation:pl .6s}.sti svg{width:26px;height:26px;display:block}.circ svg{width:26px;height:26px}.avb svg{width:44px;height:44px}.av svg{width:60%;height:60%}
nav button svg{width:26px;height:26px}nav button:not(.on) svg{opacity:.55}nav button b{line-height:0;height:28px;display:grid;place-items:center;margin-bottom:2px}nav button{transition:.2s}nav button.on svg{animation:pop .4s}
.trw{animation:fl 3s ease-in-out infinite;filter:drop-shadow(0 0 14px #fff6)}.pd .bar{transform-origin:bottom;animation:gr .8s cubic-bezier(.2,.9,.3,1) both}.pd:nth-child(2) .bar{animation-delay:.1s}
.modal.on{animation:fi .25s}.modal.on .sheet{animation:sl .35s cubic-bezier(.2,.9,.3,1)}#toast{transform:translate(-50%,-24px) scale(.9);transition:.35s cubic-bezier(.3,1.4,.5,1)}#toast.on{opacity:1;transform:translate(-50%,0) scale(1)}
.coin.fl{animation:hop 1.6s cubic-bezier(.3,.7,.5,1)}.coin span svg{width:58%;height:58%}canvas.shk{animation:shk .6s}
#intro{position:fixed;inset:0;background:#000;z-index:50;display:grid;place-content:center;justify-items:center;gap:18px;transition:opacity .6s,transform .6s;overflow:hidden}#intro.out{opacity:0;transform:scale(1.15);pointer-events:none}#intro::before{content:"";position:absolute;width:320px;height:320px;border-radius:50%;background:radial-gradient(#fff3,transparent 65%);animation:ipl 2s ease-in-out infinite}#intro .ic{width:110px;position:relative;animation:ipop 1s cubic-bezier(.2,1.4,.4,1) both,glow 2s 1s infinite}#intro .it{font-size:44px;font-weight:800;font-style:italic;position:relative;animation:up .8s .5s both}#intro .it i{color:#999}.ib{width:140px;height:3px;background:#222;border-radius:3px;overflow:hidden;position:relative}.ib span{display:block;height:100%;background:#fff;animation:ld 2s .3s both}@keyframes ipop{from{transform:scale(0) rotate(-25deg);opacity:0}}@keyframes ipl{50%{transform:scale(1.25);opacity:.6}}@keyframes ld{from{width:0}to{width:100%}}.ring{box-shadow:0 0 36px #fff2}.wheel{box-shadow:0 0 30px #fff2,inset 0 0 24px #000}.wheelbox::after{content:"";position:absolute;left:50%;top:50%;width:46px;height:46px;margin:-23px;border-radius:50%;background:radial-gradient(#777,#111);border:3px solid #ccc;z-index:2}

.sheet{max-height:92vh;overflow:auto}
.case{display:flex;align-items:center;gap:14px;cursor:pointer;position:relative;overflow:hidden;transition:transform .2s,border-color .2s}.case:hover{border-color:#777}.case:active{transform:scale(.97)}
.case::after{content:"";position:absolute;top:0;left:-60%;width:40%;height:100%;background:linear-gradient(90deg,transparent,#fff2,transparent);transform:skewX(-20deg);animation:sh 4.5s infinite;pointer-events:none}
.cic{width:68px;height:68px;flex:none}.cic svg{width:100%;height:100%;animation:fl 3s ease-in-out infinite;filter:drop-shadow(0 4px 10px #000a)}
.cst{padding:9px 12px;border:1px solid #555;border-radius:12px;background:#111;font-size:13px;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}.cst.rdy{background:#fff;color:#000;animation:pl 1.6s infinite}
.pzc{width:96px;min-width:96px;height:112px;border:1px solid #3a3a3a;border-radius:16px;background:radial-gradient(circle at 50% 30%,#2a2a2a,#0a0a0a);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;font-size:13px}

.pgrid{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin:14px 0}.pgrid .pzc{width:calc(33.3% - 6px);min-width:0;height:100px}.pgrid .pzc img{width:50px;height:50px}.pgrid .pzc.nft img{width:56px;height:56px}

.pzc.big{width:150px;height:170px;margin:0 auto;animation:pop .6s cubic-bezier(.3,1.6,.5,1)}.pzc.big img{width:100px;height:100px}.pzc.big.nft img{width:110px;height:110px}.pzc.big .pst svg{width:84px;height:84px}.pzc.big b{font-size:20px}

.stg{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}.stt{border:1px solid var(--line);border-radius:16px;background:var(--card);padding:12px;font-size:13px;color:var(--mut)}.stt b{display:block;font-size:20px;color:#fff;margin-bottom:2px}

.it img{width:64px;height:64px;object-fit:cover;border-radius:12px}

</style></head><body>
<div id="toast"></div><svg width="0" height="0" style="position:absolute"><defs><linearGradient id="gw" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#777"/></linearGradient><linearGradient id="gmt" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff"/><stop offset=".45" stop-color="#cfcfcf"/><stop offset=".55" stop-color="#6a6a6a"/><stop offset="1" stop-color="#bdbdbd"/></linearGradient><linearGradient id="gd" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3d3d3d"/><stop offset="1" stop-color="#0a0a0a"/></linearGradient><radialGradient id="gr" cx=".35" cy=".3"><stop offset="0" stop-color="#777"/><stop offset="1" stop-color="#0a0a0a"/></radialGradient></defs></svg>
<div id="intro"><svg class="ic" viewBox="0 0 64 64"><path d="M6 48 3 16l16 14L32 8l13 22 16-14-3 32z" fill="url(#gmt)" stroke="#aaa" stroke-linejoin="round"/><rect x="6" y="48" width="52" height="7" rx="2.5" fill="url(#gd)" stroke="#bbb"/><circle cx="3" cy="15" r="3" fill="#fff"/><circle cx="61" cy="15" r="3" fill="#fff"/><circle cx="32" cy="8" r="3.5" fill="#fff"/></svg><div class="it">Black<i>Up</i></div><div class="ib"><span></span></div></div>

<script>
const $=s=>document.querySelector(s);
const TG=window.Telegram&&Telegram.WebApp;if(TG){TG.ready();TG.expand()}
let bal=0,hist=[],tab='home',game=null,stop=null,tmr,vol={m:80,w:80,l:80},inv=[],admin=0,promos={},reg={},uname='';
try{vol=JSON.parse(localStorage.getItem('bu_vol')||'null')||vol}catch(e){}
const save=()=>{try{localStorage.setItem('bu_vol',JSON.stringify(vol))}catch(e){}};
const A=async(p,b)=>{try{const r=await fetch(p,{method:'POST',headers:{'Content-Type':'application/json','X-Init':TG?TG.initData:''},body:JSON.stringify(b||{})});let j;try{j=await r.json()}catch(e){toast('Ошибка сервера '+r.status);return{err:1}}if(j.err)toast(j.err);return j}catch(e){toast('Нет связи с сервером');return{err:1}}};
const sync=r=>{if(!r)return;if(r.name!=null)uname=r.name;if(r.admin!=null)admin=r.admin?1:0;if(r.promos)promos=r.promos;if(r.hist)hist=r.hist;if(r.inv)inv=r.inv;if(r.bal!=null){bal=r.bal;const e=$('#bal');if(e)tw(e,bal)}};
const dec=b=>{bal-=b;const e=$('#bal');if(e)tw(e,bal)};
const loadTop=async()=>{const r=await A('/api/top');if(r.top){const n={};r.top.forEach(x=>n[x.n]={b:x.b});if(JSON.stringify(n)!=JSON.stringify(reg)){reg=n;if(!game&&(tab=='home'||tab=='top'))draw()}}};
let cfg={snd:1,hap:1,an:1},ctm;try{Object.assign(cfg,JSON.parse(localStorage.getItem('bu_cfg')||'{}'))}catch(e){}
const saveCfg=()=>{try{localStorage.setItem('bu_cfg',JSON.stringify(cfg))}catch(e){}};document.body.classList.toggle('na',!cfg.an);
const hp=(t='light')=>{if(cfg.hap&&TG&&TG.HapticFeedback)try{TG.HapticFeedback.impactOccurred(t)}catch(e){}};
const hn=t=>{if(cfg.hap&&TG&&TG.HapticFeedback)try{TG.HapticFeedback.notificationOccurred(t)}catch(e){}};
if(TG&&TG.BackButton)TG.BackButton.onClick(()=>go('home'));
const bb=()=>{if(TG&&TG.BackButton)game?TG.BackButton.show():TG.BackButton.hide()};
const fmt=n=>Math.round(n).toLocaleString('ru-RU').replace(/\u00a0/g,' ');
const toast=t=>{const e=$('#toast');e.textContent=t;e.classList.add('on');clearTimeout(tmr);tmr=setTimeout(()=>e.classList.remove('on'),1800)};
const setBal=(d,why)=>{bal=Math.max(0,Math.round(bal+d));if(why)hist.unshift({t:why,d,ts:new Date().toLocaleString('ru-RU')});hist=hist.slice(0,30);save();const b=$('#bal');if(b)tw(b,bal)};
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
let bet=100;
const betBox=()=>`<div class="card"><div class="mut" style="margin-bottom:6px">Ставка</div><input id="bet" type="number" inputmode="numeric" value="${bet}"><div class="chips"><div class="chip" onclick="qb('h')">½</div><div class="chip" onclick="qb(2)">×2</div><div class="chip" onclick="qb(100)">100</div><div class="chip" onclick="qb(500)">500</div><div class="chip" onclick="qb('m')">MAX</div></div></div>`;
const qb=v=>{let x=+$('#bet').value||0;x=v=='h'?x/2:v=='m'?bal:v==2?x*2:v;$('#bet').value=Math.max(1,Math.min(Math.floor(x),bal))};
const getBet=()=>{const x=Math.floor(+$('#bet').value);if(!x||x<1){toast('Введите ставку');return 0}if(x>bal){toast('Недостаточно звёзд');return 0}bet=x;return x};
const nav=()=>{$('#nav').innerHTML=[['home',I.home,'Главная'],['case',I.casen,'Кейсы'],['top',I.trophy,'Топ'],['prof',I.user,'Профиль'],['set',I.gear,'Настройки']].concat(admin?[['adm',I.shield,'Админ']]:[]).map(a=>`<button class="${tab==a[0]&&!game?'on':''}" onclick="go('${a[0]}')"><b>${a[1]}</b>${a[2]}</button>`).join('')};
const go=t=>{if(stop)stop();stop=null;game=null;tab=t;clearInterval(ctm);scrollTo(0,0);draw();if(t=='home'||t=='top')loadTop();if(t=='prof')A('/api/me').then(r=>{sync(r);if(tab=='prof'&&!game)draw()})};

const PZ={s15:{v:15,img:'teddy'},s25:{v:25,img:'box'},s35:{v:35,img:'rose'},s50:{v:50,img:'bouquet'},s75:{v:75,img:'rocket'},s100:{v:100,img:'ring'},nft:{img:'cap'}};
const CASES=[{k:'daily',n:'Дневной кейс',d:'Подарок от 15 до 100 ★',ic:'sun',pool:['s15','s25','s35','s50','s75','s100']},{k:'weekly',n:'Недельный кейс',d:'От 15 до 100 ★ и очень редкий NFT',ic:'cal',pool:['s15','s25','s35','s50','s75','s100','nft']}];
const pzHtml=(id,c='')=>{const p=PZ[id];return `<div class="pzc ${id=='nft'?'nft':''} ${c}">${p.img?`<img src="${IMG[p.img]}" alt="">`:`<span class="pst">${I.star}</span>`}<b>${p.v?p.v+' ★':'NFT'}</b></div>`};
let cs={daily:0,weekly:0,t:0};
const left=k=>cs[k]-(performance.now()-cs.t);
const fmtT=ms=>{const s=Math.floor(Math.max(0,ms)/1000),d=Math.floor(s/86400),p=n=>String(n).padStart(2,'0');return(d?d+'д ':'')+p(Math.floor(s%86400/3600))+':'+p(Math.floor(s%3600/60))+':'+p(s%60)};
const casePage=()=>`<h2 style="margin-top:18px">Кейсы</h2>`+CASES.map(c=>`<div class="card case" onclick="caseOpenUI('${c.k}')"><div class="cic">${I[c.ic]}</div><div style="flex:1"><b>${c.n}</b><div class="mut" style="font-size:13px;margin-top:2px">${c.d}</div></div><div class="cst" id="cs_${c.k}">…</div></div>`).join('')+`<div class="mut c" style="font-size:13px">Бесплатно: дневной раз в 24 часа, недельный раз в 7 дней</div>`;
